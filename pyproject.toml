[project]
name = "final-review-agent"
version = "0.1.0"
description = "Source-grounded local course review agent"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3",
  "python-multipart>=0.0.18,<1", "python-dotenv>=1,<2",
  "chromadb>=1,<2", "rapid-latex-ocr==0.0.9",
  "tokenizers>=0.21,<1", "huggingface-hub>=0.30,<2", "numpy>=2,<3",
  "pypdf>=5,<7", "python-pptx>=1,<2", "python-docx>=1.2,<2",
  "rapidocr==3.9.2", "opencv-python-headless==4.11.0.86", "pypdfium2>=4.30,<6",
  "pillow>=10,<13", "onnxruntime>=1.20,<2",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.uv]
package = false
required-version = ">=0.11.7"
# OCR imports cv2; headless provides it without desktop window support.
# Chroma needs kubernetes only for its distributed server, never PersistentClient.
exclude-dependencies = ["opencv-python", "kubernetes"]
# rapid-latex-ocr is pure Python but caps NumPy below 2; one environment keeps the bundle small.
# NumPy 2.4 makes its int(array) conversion an error, so stay below it.
override-dependencies = ["numpy>=2,<2.4"]

