[project]
name = "review-formula-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "rapid-latex-ocr==0.0.9", "opencv-python-headless==4.11.0.86",
  "onnxruntime>=1.20,<2", "pillow>=10,<13", "requests>=2.32,<3",
]

[tool.uv]
package = false
required-version = ">=0.11.7"
# Match the main environment's cv2 build so uv can share installed files.
exclude-dependencies = ["opencv-python"]
